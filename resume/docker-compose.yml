# Production-ready Compose for the ATS Resume Builder.
# Tested for: `docker-compose up --build` -> open http://<host>:3000
#
# State note: the backend is intentionally stateless. There is no DB; the
# parsed resume + LaTeX source live in the browser's Zustand store. A page
# refresh loses unsaved work — this is by design for a 5-user on-prem tool.
# (Compose `version:` is obsolete in Compose v2 and intentionally omitted.)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-resume-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    # NOTE: a `./backend/app:/app/app` bind-mount was previously used so code
    # changes hot-reloaded under uvicorn --reload. The production CMD no longer
    # uses --reload, and shipping a bind-mount in prod would mean the running
    # container reads host code instead of the image it was built from. For
    # development, run `uvicorn app.main:app --reload` locally or add a
    # docker-compose.override.yml with the bind-mount + DEBUG=True.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  # spaCy en_core_web_lg loads on first request
    networks:
      - ats-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-resume-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    # NOTE: the frontend talks to the backend through nginx's `/api` proxy
    # (see frontend/nginx.conf) using a relative base URL. VITE_API_URL is a
    # BUILD-time variable for Vite, so it cannot be injected here at runtime;
    # the relative `/api` default is correct for this Compose setup.
    restart: unless-stopped
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge
