<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Kitchen — Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #dcfce7;
        color: #14532d;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .card { max-width: 24rem; padding: 2rem; }
      h1 { font-size: 1.5rem; }
      a { color: #15803d; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🛒 You're offline</h1>
      <p>
        No connection right now — but your grocery list is saved on this device.
        Reopen the app to keep checking items off; everything syncs automatically
        when you're back online.
      </p>
      <p><a href="/">Reload Smart Kitchen</a></p>
    </div>
  </body>
</html>
